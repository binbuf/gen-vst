name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# v0.1 ships unsigned installers. Codesigning / notarization is a v0.2 task:
# Windows needs a code-signing cert + SignTool; macOS needs Apple Developer ID
# Application + Installer certs and `xcrun notarytool`. Both rely on repository
# secrets that don't exist yet.

jobs:
  # ---------------------------------------------------------------------------
  # Windows: MSBuild Release, Inno Setup installer.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $sha = $env:GITHUB_SHA.Substring(0, 7)
            $v = "0.3.1-dev.$($env:GITHUB_RUN_NUMBER)+$sha"
          }
          "value=$v"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$v"    | Out-File -FilePath $env:GITHUB_ENV    -Append
          Write-Host "Version: $v"

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/windows-release/_deps
          key: juce-8.0.4-${{ runner.os }}-v2

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Configure
        run: cmake --preset windows-release -DGENVST_DEV_SERVER=OFF -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build/windows-release --config Release --parallel

      - name: Test
        run: ctest --test-dir build/windows-release -C Release --output-on-failure

      - name: Pluginval (soft gate)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip `
            -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe `
            --strictness-level 8 `
            --validate-in-process false `
            "build/windows-release/src/GenVst_artefacts/Release/VST3/Gen VST.vst3"

      - name: clap-validator (soft gate)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-windows.zip `
            -OutFile clap-validator.zip
          Expand-Archive clap-validator.zip -DestinationPath clap-validator
          & .\clap-validator\clap-validator.exe validate `
            "build/windows-release/src/GenVst_artefacts/Release/CLAP/Gen VST.clap"

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-release/installer | Out-Null
          & iscc /DAppVersion=$env:VERSION packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed (exit $LASTEXITCODE)" }
          Get-ChildItem build/windows-release/installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen-vst-windows
          path: build/windows-release/installer/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS Apple Silicon (arm64) — macos-14 runner.
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.3.1-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          fi
          echo "value=$v"   >> "$GITHUB_OUTPUT"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/macos-release/_deps
          key: juce-8.0.4-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Configure
        run: cmake --preset macos-release -DGENVST_DEV_SERVER=OFF -DCOPY_PLUGIN_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build/macos-release --config Release --parallel

      - name: Test
        run: ctest --test-dir build/macos-release -C Release --output-on-failure

      - name: auval smoke test
        continue-on-error: true
        run: auval -v aumu Genv GnVs

      - name: clap-validator (soft gate)
        continue-on-error: true
        run: |
          curl -sSL -o clap-validator.tar.gz \
            https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-macos-universal.tar.gz
          tar -xzf clap-validator.tar.gz
          ./clap-validator validate "build/macos-release/src/GenVst_artefacts/Release/CLAP/Gen VST.clap"

      - name: Build pkg installer
        run: bash packaging/macos/build-pkg.sh "$VERSION" macos-Apple-Silicon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen-vst-macos-Apple-Silicon
          path: build/macos-release/installer/*.pkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS Intel (x86_64) — macos-15-intel runner. (macos-13 was retired by
  # GitHub on 2025-12-08; the macos-15-intel label is the documented
  # replacement for hosted x86_64 builds and is supported through Fall 2027.)
  # ---------------------------------------------------------------------------
  build-macos-x86_64:
    runs-on: macos-15-intel
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.3.1-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          fi
          echo "value=$v"   >> "$GITHUB_OUTPUT"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/macos-release/_deps
          key: juce-8.0.4-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Configure
        run: cmake --preset macos-release -DGENVST_DEV_SERVER=OFF -DCOPY_PLUGIN_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: cmake --build build/macos-release --config Release --parallel

      - name: Test
        run: ctest --test-dir build/macos-release -C Release --output-on-failure

      - name: auval smoke test
        continue-on-error: true
        run: auval -v aumu Genv GnVs

      - name: clap-validator (soft gate)
        continue-on-error: true
        run: |
          curl -sSL -o clap-validator.tar.gz \
            https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-macos-universal.tar.gz
          tar -xzf clap-validator.tar.gz
          ./clap-validator validate "build/macos-release/src/GenVst_artefacts/Release/CLAP/Gen VST.clap"

      - name: Build pkg installer
        run: bash packaging/macos/build-pkg.sh "$VERSION" macos-Apple-Intel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen-vst-macos-Apple-Intel
          path: build/macos-release/installer/*.pkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: Ninja Release, AppImage (Standalone) + tar.gz (VST3 + CLAP).
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libcurl4-openssl-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            ninja-build libfuse2t64 xvfb

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.3.1-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          fi
          echo "value=$v"   >> "$GITHUB_OUTPUT"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/linux-release/_deps
          key: juce-8.0.4-${{ runner.os }}-v2

      - name: Configure
        run: cmake --preset linux-release -DGENVST_DEV_SERVER=OFF -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Test
        run: ctest --test-dir build/linux-release --output-on-failure

      - name: Pluginval (soft gate)
        continue-on-error: true
        run: |
          curl -sSL -o pluginval_Linux.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval_Linux.zip
          chmod +x pluginval
          xvfb-run -a ./pluginval \
            --strictness-level 8 \
            --validate-in-process false \
            "build/linux-release/src/GenVst_artefacts/Release/VST3/Gen VST.vst3"

      - name: clap-validator (soft gate)
        continue-on-error: true
        run: |
          curl -sSL -o clap-validator.tar.gz \
            https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz
          tar -xzf clap-validator.tar.gz
          chmod +x clap-validator
          xvfb-run -a ./clap-validator validate \
            "build/linux-release/src/GenVst_artefacts/Release/CLAP/Gen VST.clap"

      - name: Build AppImage (Standalone)
        run: bash packaging/linux/build-appimage.sh "$VERSION"

      - name: Build tarball (VST3)
        run: bash packaging/linux/build-tarball.sh "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen-vst-linux
          path: |
            build/linux-release/installer/*.AppImage
            build/linux-release/installer/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: tag-gated; collects per-OS artifacts, publishes a GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-24.04
    needs: [build-windows, build-macos-arm64, build-macos-x86_64, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show artifacts
        run: find dist -maxdepth 3 -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          name: "Gen VST ${{ needs.build-linux.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/gen-vst-windows/*.exe
            dist/gen-vst-macos-Apple-Silicon/*.pkg
            dist/gen-vst-macos-Apple-Intel/*.pkg
            dist/gen-vst-linux/*.AppImage
            dist/gen-vst-linux/*.tar.gz
          body: |
            ## Installation

            **Windows** — Run the `.exe` installer. Installs the VST3 to `C:\Program Files\Common Files\VST3` (admin), the CLAP to `C:\Program Files\Common Files\CLAP`, the Standalone to `Program Files\Gen VST`, and factory patches to `%LOCALAPPDATA%\GenVst\patches`. Unsigned for this release; Windows SmartScreen may prompt — choose "More info" → "Run anyway".

            **macOS (Apple Silicon)** — Download `*-macos-Apple-Silicon.pkg`. Unsigned for this release; Gatekeeper will refuse to open it on first try. The installer places the VST3 in `/Library/Audio/Plug-Ins/VST3`, the AU in `/Library/Audio/Plug-Ins/Components`, the CLAP in `/Library/Audio/Plug-Ins/CLAP`, and the Standalone in `/Applications`. To bypass Gatekeeper on macOS Tahoe (15+):

            1. Double-click the `.pkg` — macOS shows a "cannot be opened" warning. Click **Done** to dismiss it.
            2. Open  → **System Settings** → **Privacy & Security**.
            3. Scroll down to the **Security** section. You'll see a line about the blocked `.pkg` with an **Open Anyway** button — click it, then re-confirm in the prompt that follows.

            On older macOS (Sonoma / Sequoia and earlier), **right-click → Open** (not double-click) is usually enough.

            **macOS (Intel)** — Download `*-macos-Apple-Intel.pkg`. Same installation steps as above.

            **Linux** (plugin) — Extract the `.tar.gz` and run `./install.sh`. Drops the VST3 into `~/.vst3`, the CLAP into `~/.clap`, and factory patches into `~/.local/share/GenVst/patches`.

            **Linux** (Standalone) — `chmod +x` the `.AppImage` and run. **Runtime prerequisite**: `libwebkit2gtk-4.1-0` must be installed on the host (`sudo apt install libwebkit2gtk-4.1-0`). The AppImage is built without bundling WebKitGTK so it stays small and avoids conflicts with the system runtime.

            ## Verifying

            VST3 / AU / CLAP / Standalone are formats — pick whichever your DAW supports.
            On macOS, the AU validates with `auval -v aumu Genv GnVs`.
            The CLAP can be checked with `clap-validator validate "Gen VST.clap"`.
