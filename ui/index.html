<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=640, initial-scale=1" />
    <title>Gen VST</title>
  </head>
  <body>
    <div id="chassis">
      <!-- ============================ HEADER ============================ -->
      <header id="header">
        <canvas id="wordmark" width="128" height="36"></canvas>
        <canvas id="true-stereo" width="76" height="36" data-tip="TRUE STEREO (OFF = SUM L+R TO MONO)"></canvas>
        <div class="meter-bay">
          <canvas id="vu-meter" class="bevel-inset" width="56" height="36" data-tip="STEREO OUTPUT LEVEL"></canvas>
          <canvas id="scope" class="bevel-inset" width="160" height="36" data-tip="MIXED OUTPUT WAVEFORM"></canvas>
        </div>
        <div class="header-right">
          <canvas id="seg-display" class="bevel-inset" width="452" height="44" data-tip="CURRENT PATCH NAME"></canvas>
        </div>
        <div class="header-right-bottom">
          <canvas id="voice-leds"></canvas>
          <canvas id="clip-led"></canvas>
        </div>
        <canvas id="gear" width="18" height="18" data-tip="OPEN SETTINGS"></canvas>
      </header>

      <!-- =========================== MIDDLE ============================= -->
      <div id="middle">
        <!-- Left column — LFO / Algorithm / Feedback -->
        <section class="column" id="col-left">
          <div class="panel bevel-raised">
            <div class="panel-header"><span class="label">LFO &middot; ALG</span></div>
            <div class="panel-body">
              <div class="lfo-row">
                <div class="lfo-cell" data-tip="LFO RATE (GLOBAL LOW FREQ OSCILLATOR)">
                  <canvas id="lfo-knob" class="knob" width="32" height="32"></canvas>
                  <canvas id="lfo-readout" class="led" width="36" height="18"></canvas>
                  <span class="label">LFO</span>
                </div>
                <div class="lfo-cell" data-tip="AMPLITUDE MODULATION SENSITIVITY">
                  <canvas id="ams-knob" class="knob" width="32" height="32"></canvas>
                  <canvas id="ams-readout" class="led" width="36" height="18"></canvas>
                  <span class="label">AMS</span>
                </div>
                <div class="lfo-cell" data-tip="FREQUENCY MODULATION SENSITIVITY">
                  <canvas id="fms-knob" class="knob" width="32" height="32"></canvas>
                  <canvas id="fms-readout" class="led" width="36" height="18"></canvas>
                  <span class="label">FMS</span>
                </div>
              </div>

              <div class="algo-block">
                <span class="label">ALGORITHM</span>
                <div class="algo-buttons-row" data-tip="FM ALGORITHM 1..8 (CARRIERS HIGHLIGHTED)">
                  <canvas id="algo-buttons"></canvas>
                </div>
                <div class="algo-bottom">
                  <div class="feedback-cell" data-tip="OPERATOR 1 SELF FEEDBACK 0..7 (0=OFF)">
                    <canvas id="fb-knob" class="knob" width="40" height="40"></canvas>
                    <canvas id="fb-readout" class="led" width="36" height="18"></canvas>
                    <span class="label">FB</span>
                  </div>
                  <canvas id="algo-diagram" class="bevel-inset" width="160" height="88" data-tip="FM OPERATOR ROUTING DIAGRAM"></canvas>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Center column — Instrument rack + per-instrument routing
             (Task 22 / 08-ui-views.md view 1 revised). The rack list replaces
             the old fixed Instruments LCD + section pills + global routing
             strip; type tab + channel slots stay visible as read-only context
             for the selected row. -->
        <section class="column" id="col-center">
          <div class="panel bevel-raised">
            <div class="panel-header">
              <span class="label">Instruments</span>
              <button id="rack-add-btn" type="button" class="rack-pill-btn" data-tip="ADD INSTRUMENT (FM / SQ / D)">+</button>
              <button id="rack-remove-btn" type="button" class="rack-pill-btn" data-tip="REMOVE SELECTED INSTRUMENT">&minus;</button>
            </div>
            <div class="panel-body">
              <canvas id="instrument-rack" width="268" height="160" data-tip="RACK ROWS: CLICK TO SELECT, + TO ADD, - TO REMOVE, ::: TO DRAG"></canvas>
              <div class="center-controls">
                <!-- Type indicator (read-only this pass — row click picks the type). -->
                <canvas id="section-pills" width="120" height="16" data-tip="SECTION: FM / SQ (PSG) / D (DAC)"></canvas>
                <span class="center-label">Channels</span>
                <div id="channels-row"></div>

                <!-- Per-instrument routing strip — binds to the selected
                     rack row's apvts params via the canonical helpers. -->
                <div class="routing-group" id="rack-routing-group">
                  <span>MIDI</span><div id="rack-midi-cell"></div>
                  <span>TRPS</span>
                  <div class="trps-cell">
                    <div id="rack-trps-st-cell"></div>
                    <div id="rack-trps-oct-cell"></div>
                  </div>
                  <span>RNG</span>
                  <div class="rng-cell">
                    <canvas id="rack-range-slider" width="56" height="14" data-tip="NOTE RANGE (LO ... HI)"></canvas>
                    <canvas id="rack-range-readout" class="led" width="32" height="14" data-tip="NOTE RANGE LO-HI"></canvas>
                  </div>
                  <span>DET</span>
                  <div class="rack-det-cell">
                    <canvas id="rack-detune-slider" width="56" height="14" data-tip="DETUNE IN CENTS"></canvas>
                    <canvas id="rack-detune-readout" class="led" width="28" height="14"></canvas>
                  </div>
                  <span id="rack-glide-label">GLD</span>
                  <div class="rack-gld-cell" id="rack-glide-cell">
                    <canvas id="rack-glide-slider" width="56" height="14" data-tip="GLIDE / PORTAMENTO TIME IN MS (ACTIVE IN MONO + LEGATO)"></canvas>
                    <canvas id="rack-glide-readout" class="led" width="32" height="14"></canvas>
                  </div>
                  <span>BAL</span><canvas id="rack-balance-slider" width="92" height="14" data-tip="L/R BALANCE"></canvas>
                </div>

                <!-- View 10 — per-part polyphony. The mode selector is always
                     visible; GLIDE shows only in MONO, SPREAD only in UNISON. -->
                <div class="poly-group">
                  <span class="poly-label-mode">POLY</span><canvas id="poly-mode-pills" width="60" height="14" data-tip="POLYPHONY MODE: POLY / MONO / UNISON"></canvas>
                  <span class="poly-label-glide">GLD</span><canvas id="mono-glide-pills" width="60" height="14" data-tip="MONO MODE: RETRIGGER OR LEGATO"></canvas>
                  <span class="poly-label-spread">SPR</span>
                  <div class="spread-row">
                    <canvas id="unison-spread-slider" width="56" height="14" data-tip="UNISON DETUNE SPREAD IN CENTS"></canvas>
                    <canvas id="unison-spread-readout" class="led" width="28" height="14"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Right column — Presets / Import -->
        <section class="column" id="col-right">
          <div class="panel bevel-raised">
            <div class="panel-header">
              <canvas id="preset-tabs" width="160" height="16"></canvas>
            </div>
            <div class="panel-body">
              <canvas id="preset-list" width="256" height="196" data-tip="USER PATCHES (CLICK TO LOAD)"></canvas>
            </div>
          </div>
        </section>
      </div>

      <!-- =========================== BOTTOM ============================= -->
      <!-- One physical bottom region; its content is one of three sibling
           views (FM operator panels / SQ panels / D sample+playback) toggled
           by body[data-section] (see sections.css). Each view is mounted by
           its own module — main.js owns the orchestration. -->
      <div id="bottom-host">
        <div id="bottom">
          <!-- Operator panels are appended by fm-view.js so the layout stays
               in lockstep with kNumOps (4) without duplicating markup. -->
        </div>
        <div id="bottom-sq"></div>
        <div id="bottom-d"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
