<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Gen VST</title>
  </head>
  <body>
    <!-- v2 chassis skeleton. Header + empty mode panel — Tasks 05-07 mount
         the FM / SQ / D panels into #mode-panel; Task 08 mounts the
         persistent header (mode pill, patch LCD, filter / ladder toggles,
         L/R meters, DAC PRESC, VOL, TIPS, gear) into the header element. -->
    <div class="frame chassis">
      <header class="hdr inset"></header>
      <main id="mode-panel" class="mode-panel inset">
        <!-- Per-mode contents arrive in mvp2/05-07. -->
      </main>
      <div id="keyboard-strip" class="keyboard-strip inset"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
