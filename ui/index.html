<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=560, initial-scale=1" />
    <title>Gen VST</title>
  </head>
  <body>
    <div id="chassis">
      <!-- ============================ HEADER ============================ -->
      <header id="header">
        <canvas id="wordmark" width="128" height="36"></canvas>
        <div class="meter-bay">
          <canvas id="vu-meter" class="bevel-inset" width="56" height="36"></canvas>
          <canvas id="scope" class="bevel-inset" width="160" height="36"></canvas>
        </div>
        <div class="header-right">
          <canvas id="seg-display" class="bevel-inset" width="536" height="44"></canvas>
        </div>
        <div class="header-right-bottom">
          <canvas id="voice-leds"></canvas>
          <canvas id="clip-led"></canvas>
        </div>
        <canvas id="gear" width="18" height="18"></canvas>
      </header>

      <!-- =========================== MIDDLE ============================= -->
      <div id="middle">
        <!-- Left column — LFO / Algorithm / Feedback -->
        <section class="column" id="col-left">
          <div class="panel bevel-raised">
            <div class="panel-header"><span class="label">LFO &middot; ALG</span></div>
            <div class="panel-body">
              <div class="lfo-row">
                <div class="lfo-cell">
                  <canvas id="lfo-knob" class="knob" width="28" height="28"></canvas>
                  <canvas id="lfo-readout" class="led" width="36" height="18"></canvas>
                  <span class="label">LFO</span>
                </div>
                <div class="lfo-cell">
                  <canvas id="ams-knob" class="knob" width="28" height="28"></canvas>
                  <canvas id="ams-readout" class="led" width="36" height="18"></canvas>
                  <span class="label">AMS</span>
                </div>
                <div class="lfo-cell">
                  <canvas id="fms-knob" class="knob" width="28" height="28"></canvas>
                  <canvas id="fms-readout" class="led" width="36" height="18"></canvas>
                  <span class="label">FMS</span>
                </div>
              </div>

              <div class="algo-block">
                <span class="label">ALGORITHM</span>
                <div class="algo-buttons-row">
                  <canvas id="algo-buttons"></canvas>
                </div>
                <div class="algo-bottom">
                  <div class="feedback-cell">
                    <canvas id="fb-knob" class="knob" width="36" height="36"></canvas>
                    <canvas id="fb-readout" class="led" width="36" height="18"></canvas>
                    <span class="label">FB</span>
                  </div>
                  <canvas id="algo-diagram" class="bevel-inset" width="146" height="70"></canvas>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Center column — Instruments + channel routing -->
        <section class="column" id="col-center">
          <div class="panel bevel-raised">
            <div class="panel-header"><span class="label">Instruments</span></div>
            <div class="panel-body">
              <canvas id="instruments-list" width="268" height="210"></canvas>
              <div class="center-controls">
                <canvas id="section-pills" width="120" height="16"></canvas>
                <span class="center-label">Channels</span>
                <div id="channels-row"></div>

                <div class="routing-group">
                  <span>MIDI</span><div class="placeholder">1</div>
                  <span>TRPS</span><div class="placeholder">0 0</div>
                  <span>RNG</span><div class="placeholder">0&ndash;127</div>
                  <span>DEL</span><div class="placeholder">0</div>
                  <span>PAN</span><canvas id="pan-slider" width="90" height="14"></canvas>
                </div>

                <div class="poly-group">
                  <span>POLY</span><div class="placeholder">POLY</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Right column — Presets / Import -->
        <section class="column" id="col-right">
          <div class="panel bevel-raised">
            <div class="panel-header">
              <canvas id="preset-tabs" width="160" height="16"></canvas>
            </div>
            <div class="panel-body">
              <canvas id="preset-list" width="256" height="220"></canvas>
            </div>
          </div>
        </section>
      </div>

      <!-- =========================== BOTTOM ============================= -->
      <div id="bottom">
        <!-- Operator panels are appended by fm-view.js so the layout stays
             in lockstep with kNumOps (4) without duplicating markup. -->
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
